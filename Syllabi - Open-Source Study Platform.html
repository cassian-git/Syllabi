<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabi - Dump your syllabus. Master concepts. Skip the cram.</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Production CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation in-browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom 3D Card Flip Animation */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* Smooth Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100,100,100,0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased flex flex-col selection:bg-brand-500 selection:text-white">

  <div id="root" class="flex-1 flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- SAMPLE SYLLABI FOR ONE-CLICK DEMO ---
    const SAMPLES = {
      biology: `Course Title: General Biology 101
Instructor: Dr. Aris Thorne
Module 1: Cellular Respiration & ATP Synthesis
- Glycolysis takes place in the cytoplasm and breaks glucose down into 2 pyruvate molecules without needing oxygen.
- The Krebs Cycle occurs in the mitochondrial matrix, producing electron carriers (NADH and FADH2).
- Electron Transport Chain utilizes mitochondrial inner membrane gradient to synthesize the bulk of cellular ATP via ATP Synthase.

Module 2: Photosynthesis & Calvin Cycle
- Light-dependent reactions happen in the thylakoid membranes, converting light energy into NADPH and ATP while splitting water to release O2.
- The Calvin Cycle takes place in the stroma, using RuBisCO to fix carbon dioxide into glucose molecules.

Module 3: Genetics & DNA Replication
- DNA polymerase synthesizes new strands in the 5' to 3' direction continuously on the leading strand and discontinuously on the lagging strand via Okazaki fragments.
- Transcription converts DNA to mRNA in the nucleus, which is then translated by ribosomes into functional proteins.`,

      cs: `Course Title: Data Structures & Algorithms
Instructor: Prof. Elena Rostova
Module 1: Asymptotic Analysis & Big O
- Big O notation describes the upper bound of algorithm execution time relative to input size N.
- O(1) is constant time, O(log N) is logarithmic search time, O(N) is linear pass, O(N^2) represents nested loops.

Module 2: Arrays, Linked Lists & Dynamic Storage
- Arrays offer O(1) random access by index, but resizing requires O(N) memory copy operations.
- Singly and Doubly Linked Lists allow O(1) insertions/deletions at nodes, but searching requires O(N) sequential traversal.

Module 3: Binary Search Trees & Graph Algorithms
- A Binary Search Tree maintains keys where left children are smaller and right children are larger; search/insert is O(log N) average, O(N) worst case.
- Breadth-First Search (BFS) uses a Queue to explore graph level-by-level, whereas Depth-First Search (DFS) uses a Stack to explore as deep as possible.`
    };

    // --- DEFAULT INITIAL STATE ---
    const DEFAULT_MODULES = [
      {
        id: "mod-1",
        title: "Cellular Respiration & ATP Synthesis",
        simplification: "Cellular respiration is how cells turn food (glucose) into battery power (ATP). It happens in three steps: Glycolysis (cytoplasm), Krebs Cycle (mitochondria core), and the Electron Transport Chain (mitochondria wall).",
        takeaways: [
          "Glycolysis breaks down glucose into 2 pyruvates in the cytoplasm without oxygen.",
          "Krebs Cycle generates electron-rich molecules (NADH, FADH2) in the mitochondrial matrix.",
          "The Electron Transport Chain creates the vast majority of ATP using a proton gradient."
        ]
      },
      {
        id: "mod-2",
        title: "Photosynthesis & Light Reactions",
        simplification: "Photosynthesis is the reverse process of respiration—plants take sunlight, water, and CO2 to create oxygen and glucose. Light reactions split water; Calvin cycle fixes CO2.",
        takeaways: [
          "Light-dependent reactions occur in thylakoids and produce ATP + NADPH + Oxygen.",
          "Calvin cycle occurs in the stroma and fixes atmospheric carbon into sugar."
        ]
      }
    ];

    const DEFAULT_FLASHCARDS = [
      {
        id: "card-1",
        moduleId: "mod-1",
        front: "Where does Glycolysis take place, and does it require oxygen?",
        back: "It occurs in the cytoplasm and does NOT require oxygen (it is anaerobic).",
        repetitions: 0,
        interval: 1,
        easeFactor: 2.5,
        nextReviewDate: new Date().toISOString()
      },
      {
        id: "card-2",
        moduleId: "mod-1",
        front: "What is the primary product generated by the Electron Transport Chain?",
        back: "The bulk of the cell's ATP energy molecules, driven by the ATP Synthase engine.",
        repetitions: 0,
        interval: 1,
        easeFactor: 2.5,
        nextReviewDate: new Date().toISOString()
      },
      {
        id: "card-3",
        moduleId: "mod-2",
        front: "What enzyme fixes CO2 during the Calvin Cycle in photosynthesis?",
        back: "RuBisCO enzyme in the stroma.",
        repetitions: 0,
        interval: 1,
        easeFactor: 2.5,
        nextReviewDate: new Date().toISOString()
      }
    ];

    // --- SUPERMEMO-2 (SM-2) ALGORITHM IMPLEMENTATION ---
    function applySM2(card, quality) {
      // quality: 1 = Again, 2 = Hard, 3 = Good, 4 = Easy
      let { repetitions, interval, easeFactor } = card;

      if (quality >= 2) {
        if (repetitions === 0) {
          interval = 1;
        } else if (repetitions === 1) {
          interval = 3;
        } else {
          interval = Math.round(interval * easeFactor);
        }
        repetitions += 1;
      } else {
        // "Again" resets streak
        repetitions = 0;
        interval = 1;
      }

      // Adjust ease factor based on performance
      easeFactor = easeFactor + (0.1 - (5 - (quality + 1)) * (0.08 + (5 - (quality + 1)) * 0.02));
      if (easeFactor < 1.3) easeFactor = 1.3;

      const nextDate = new Date();
      nextDate.setDate(nextDate.getDate() + interval);

      return {
        ...card,
        repetitions,
        interval,
        easeFactor,
        nextReviewDate: nextDate.toISOString()
      };
    }

    // --- SYLLABUS PARSER ENGINE ---
    function parseSyllabusToContent(rawText) {
      const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
      const modules = [];
      const flashcards = [];

      let currentModule = null;

      lines.forEach((line) => {
        // Detect headers or modules
        if (line.toLowerCase().startsWith('module') || line.toLowerCase().startsWith('chapter') || line.toLowerCase().startsWith('unit') || line.includes(':')) {
          if (currentModule && currentModule.takeaways.length > 0) {
            modules.push(currentModule);
          }
          
          const modId = 'mod-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
          const cleanTitle = line.replace(/^(module|chapter|unit)\s*\d*[:\-]?\s*/i, '');
          
          currentModule = {
            id: modId,
            title: cleanTitle || line,
            simplification: `Core overview: ${cleanTitle}. Focuses on fundamental mechanics, essential rules, and real-world application without academic jargon.`,
            takeaways: []
          };
        } else if (line.startsWith('-') || line.startsWith('*') || line.startsWith('•')) {
          const bulletContent = line.replace(/^[\-\*\•]\s*/, '');
          if (!currentModule) {
            currentModule = {
              id: 'mod-' + Date.now(),
              title: "General Concepts",
              simplification: "Fundamental concept breakdown from your syllabus input.",
              takeaways: []
            };
          }
          currentModule.takeaways.push(bulletContent);

          // Auto-generate flashcard from bullet
          const cardId = 'card-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
          let question = `What are the key details regarding "${bulletContent.slice(0, 45)}..."?`;
          let answer = bulletContent;

          if (bulletContent.includes('takes place') || bulletContent.includes('occurs')) {
            question = `Where does this occur: "${bulletContent.split('occurs')[0].split('takes place')[0]}"?`;
          } else if (bulletContent.includes('is') || bulletContent.includes('describes')) {
            const parts = bulletContent.split(/is|describes/);
            question = `What is ${parts[0].trim()}?`;
            answer = parts.slice(1).join(' ').trim();
          }

          flashcards.push({
            id: cardId,
            moduleId: currentModule.id,
            front: question,
            back: answer || bulletContent,
            repetitions: 0,
            interval: 1,
            easeFactor: 2.5,
            nextReviewDate: new Date().toISOString()
          });
        }
      });

      if (currentModule && currentModule.takeaways.length > 0) {
        modules.push(currentModule);
      }

      // Fallback if formatting was unstructured
      if (modules.length === 0) {
        const modId = 'mod-fallback-' + Date.now();
        modules.push({
          id: modId,
          title: "Syllabus Key Concepts",
          simplification: "Extracted high-priority concepts from your input dump.",
          takeaways: lines.slice(0, 5)
        });
        lines.slice(0, 5).forEach((line, idx) => {
          flashcards.push({
            id: 'card-fb-' + idx,
            moduleId: modId,
            front: `Concept Check #${idx + 1}`,
            back: line,
            repetitions: 0,
            interval: 1,
            easeFactor: 2.5,
            nextReviewDate: new Date().toISOString()
          });
        });
      }

      return { modules, flashcards };
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState('dump'); // 'dump', 'concepts', 'flashcards', 'decks'
      const [syllabusText, setSyllabusText] = useState('');
      const [deckName, setDeckName] = useState('My Course Syllabus');
      
      const [modules, setModules] = useState(() => {
        const saved = localStorage.getItem('syllabi_modules');
        return saved ? JSON.parse(saved) : DEFAULT_MODULES;
      });
      const [flashcards, setFlashcards] = useState(() => {
        const saved = localStorage.getItem('syllabi_flashcards');
        return saved ? JSON.parse(saved) : DEFAULT_FLASHCARDS;
      });
      const [savedDecks, setSavedDecks] = useState(() => {
        const saved = localStorage.getItem('syllabi_saved_decks');
        return saved ? JSON.parse(saved) : [];
      });
      const [streak, setStreak] = useState(() => {
        return parseInt(localStorage.getItem('syllabi_streak') || '3', 10);
      });

      // Active Recall Card Index State
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      // Persist to LocalStorage
      useEffect(() => {
        localStorage.setItem('syllabi_modules', JSON.stringify(modules));
      }, [modules]);

      useEffect(() => {
        localStorage.setItem('syllabi_flashcards', JSON.stringify(flashcards));
      }, [flashcards]);

      useEffect(() => {
        localStorage.setItem('syllabi_saved_decks', JSON.stringify(savedDecks));
      }, [savedDecks]);

      useEffect(() => {
        localStorage.setItem('syllabi_streak', streak.toString());
      }, [streak]);

      // Initialize Lucide Icons after renders
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleProcessSyllabus = () => {
        if (!syllabusText.trim()) {
          showToast('⚠️ Please paste syllabus text or load a sample first!');
          return;
        }

        const { modules: newModules, flashcards: newCards } = parseSyllabusToContent(syllabusText);
        setModules(newModules);
        setFlashcards(newCards);
        setCurrentCardIndex(0);
        setIsFlipped(false);

        // Auto-save deck into saved decks list
        const newDeck = {
          id: 'deck-' + Date.now(),
          title: deckName || 'Course Deck',
          createdAt: new Date().toLocaleDateString(),
          modulesCount: newModules.length,
          cardsCount: newCards.length,
          modules: newModules,
          flashcards: newCards
        };

        setSavedDecks(prev => [newDeck, ...prev]);
        setActiveTab('concepts');
        showToast(`🎉 Processed! Created "${newDeck.title}" with ${newCards.length} flashcards.`);
      };

      const handleLoadSample = (key) => {
        setSyllabusText(SAMPLES[key]);
        setDeckName(key === 'biology' ? 'General Biology 101' : 'Data Structures & Algorithms');
        showToast(`Loaded Sample ${key.toUpperCase()} Syllabus! Click "Process & Generate" below.`);
      };

      const handleLoadDeck = (deck) => {
        setModules(deck.modules);
        setFlashcards(deck.flashcards);
        setDeckName(deck.title);
        setCurrentCardIndex(0);
        setIsFlipped(false);
        setActiveTab('flashcards');
        showToast(`Loaded Deck: "${deck.title}"`);
      };

      const handleDeleteDeck = (deckId) => {
        setSavedDecks(prev => prev.filter(d => d.id !== deckId));
        showToast('Deleted deck from LocalStorage.');
      };

      const handleSM2Response = (quality) => {
        if (flashcards.length === 0) return;

        const currentCard = flashcards[currentCardIndex];
        const updatedCard = applySM2(currentCard, quality);

        const newCards = [...flashcards];
        newCards[currentCardIndex] = updatedCard;
        setFlashcards(newCards);

        // Advance to next card
        setIsFlipped(false);
        setTimeout(() => {
          if (currentCardIndex < flashcards.length - 1) {
            setCurrentCardIndex(prev => prev + 1);
          } else {
            setCurrentCardIndex(0);
            setStreak(s => s + 1);
            showToast('🔥 Deck completed! Review streak increased!');
          }
        }, 150);
      };

      const masteredCount = useMemo(() => {
        return flashcards.filter(c => c.repetitions > 0).length;
      }, [flashcards]);

      return (
        <div className="flex-1 flex flex-col max-w-5xl w-full mx-auto px-4 py-6">
          
          {/* TOAST NOTIFICATION */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 bg-indigo-600 text-white font-medium px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2 transition-all transform animate-bounce">
              <i data-lucide="sparkles" className="w-5 h-5"></i>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* HEADER */}
          <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-6 border-b border-slate-800">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="book-marked" className="w-6 h-6 text-white"></i>
              </div>
              <div>
                <h1 className="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                  Syllabi
                </h1>
                <p className="text-xs text-slate-400 font-medium">Dump your syllabus. Master concepts. Skip the cram.</p>
              </div>
            </div>

            {/* STREAK & STATS BADGE */}
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full">
                <i data-lucide="flame" className="w-4 h-4 text-orange-500"></i>
                <span className="text-xs font-bold text-slate-200">{streak} Day Streak</span>
              </div>
              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-full">
                <i data-lucide="check-circle-2" className="w-4 h-4 text-emerald-400"></i>
                <span className="text-xs font-bold text-slate-200">{masteredCount}/{flashcards.length} Mastered</span>
              </div>
            </div>
          </header>

          {/* TAB NAVIGATION */}
          <nav className="grid grid-cols-2 sm:grid-cols-4 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800/80 my-6 shadow-inner gap-1">
            <button
              onClick={() => setActiveTab('dump')}
              className={`py-2.5 px-3 rounded-xl font-semibold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 ${
                activeTab === 'dump'
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <i data-lucide="file-text" className="w-4 h-4"></i>
              <span>1. Syllabus Dump</span>
            </button>

            <button
              onClick={() => setActiveTab('concepts')}
              className={`py-2.5 px-3 rounded-xl font-semibold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 ${
                activeTab === 'concepts'
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <i data-lucide="book-open" className="w-4 h-4"></i>
              <span>2. Concepts</span>
            </button>

            <button
              onClick={() => setActiveTab('flashcards')}
              className={`py-2.5 px-3 rounded-xl font-semibold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 ${
                activeTab === 'flashcards'
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <i data-lucide="layers" className="w-4 h-4"></i>
              <span>3. Flashcards</span>
            </button>

            <button
              onClick={() => setActiveTab('decks')}
              className={`py-2.5 px-3 rounded-xl font-semibold text-xs sm:text-sm transition-all flex items-center justify-center gap-2 ${
                activeTab === 'decks'
                  ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                  : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
              }`}
            >
              <i data-lucide="folder" className="w-4 h-4"></i>
              <span>Saved Decks ({savedDecks.length})</span>
            </button>
          </nav>

          {/* TAB 1: SYLLABUS DUMP */}
          {activeTab === 'dump' && (
            <div className="flex-1 flex flex-col gap-5 animate-fade-in">
              <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 md:p-6 space-y-4">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <i data-lucide="upload-cloud" className="w-5 h-5 text-indigo-400"></i>
                      Paste Course Outline or Syllabus
                    </h2>
                    <p className="text-xs text-slate-400 mt-0.5">Drop raw syllabus text, modules, or lecture outlines below.</p>
                  </div>

                  {/* QUICK DEMO LOADERS */}
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => handleLoadSample('biology')}
                      className="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3 py-1.5 rounded-lg transition-all"
                    >
                      🧪 Sample Biology
                    </button>
                    <button
                      onClick={() => handleLoadSample('cs')}
                      className="text-xs bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-slate-700 px-3 py-1.5 rounded-lg transition-all"
                    >
                      💻 Sample DSA
                    </button>
                  </div>
                </div>

                <div className="space-y-1">
                  <label className="text-xs font-semibold text-slate-400">Deck Name / Title</label>
                  <input
                    type="text"
                    value={deckName}
                    onChange={(e) => setDeckName(e.target.value)}
                    placeholder="e.g. Organic Chemistry 101"
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all"
                  />
                </div>

                <textarea
                  value={syllabusText}
                  onChange={(e) => setSyllabusText(e.target.value)}
                  placeholder="Paste your dense course syllabus, module list, or reading topics here..."
                  className="w-full h-56 bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-all font-mono resize-none"
                ></textarea>

                <button
                  onClick={handleProcessSyllabus}
                  className="w-full py-4 bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold rounded-xl shadow-lg shadow-indigo-600/25 flex items-center justify-center gap-2 transition-all active:scale-[0.99]"
                >
                  <i data-lucide="cpu" className="w-5 h-5"></i>
                  <span>Process & Generate Decks</span>
                </button>
              </div>
            </div>
          )}

          {/* TAB 2: CONCEPT BREAKDOWN (ELI5) */}
          {activeTab === 'concepts' && (
            <div className="flex-1 space-y-4 animate-fade-in">
              <div className="flex items-center justify-between mb-2">
                <h2 className="text-base font-bold text-slate-200">Simplified Course Modules ({modules.length})</h2>
                <button 
                  onClick={() => setActiveTab('flashcards')}
                  className="text-xs font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1"
                >
                  <span>Start Flashcards</span>
                  <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                </button>
              </div>

              {modules.map((mod, idx) => (
                <div key={mod.id || idx} className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-3 transition-all hover:border-slate-700">
                  <div className="flex items-start gap-3">
                    <span className="text-xs font-extrabold bg-indigo-500/10 text-indigo-400 px-2.5 py-1 rounded-lg border border-indigo-500/20">
                      M{idx + 1}
                    </span>
                    <div className="flex-1">
                      <h3 className="text-base font-bold text-white">{mod.title}</h3>
                      <p className="text-xs text-slate-400 mt-1 leading-relaxed">{mod.simplification}</p>
                    </div>
                  </div>

                  {mod.takeaways && mod.takeaways.length > 0 && (
                    <div className="bg-slate-950/60 rounded-xl p-3.5 border border-slate-800/60 mt-3">
                      <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Key Takeaways</h4>
                      <ul className="space-y-1.5">
                        {mod.takeaways.map((point, pIdx) => (
                          <li key={pIdx} className="text-xs text-slate-300 flex items-start gap-2">
                            <span className="text-indigo-400 mt-0.5">•</span>
                            <span>{point}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* TAB 3: FLASHCARD REVIEW (SRS) */}
          {activeTab === 'flashcards' && (
            <div className="flex-1 flex flex-col items-center justify-center space-y-6 py-4 animate-fade-in">
              
              {flashcards.length === 0 ? (
                <div className="text-center py-12 space-y-3">
                  <i data-lucide="inbox" className="w-12 h-12 text-slate-600 mx-auto"></i>
                  <p className="text-sm text-slate-400">No flashcards available yet. Process a syllabus first!</p>
                </div>
              ) : (
                <>
                  {/* PROGRESS BAR */}
                  <div className="w-full max-w-md space-y-1.5">
                    <div className="flex justify-between text-xs text-slate-400 font-medium">
                      <span>Card {currentCardIndex + 1} of {flashcards.length}</span>
                      <span>{Math.round(((currentCardIndex + 1) / flashcards.length) * 100)}% Completed</span>
                    </div>
                    <div className="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-800">
                      <div 
                        className="bg-indigo-500 h-full transition-all duration-300"
                        style={{ width: `${((currentCardIndex + 1) / flashcards.length) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* 3D FLIP CARD */}
                  <div 
                    onClick={() => setIsFlipped(!isFlipped)}
                    className="w-full max-w-md h-72 cursor-pointer perspective-1000 group"
                  >
                    <div className={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                      
                      {/* FRONT OF CARD */}
                      <div className="absolute inset-0 bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-slate-800 group-hover:border-indigo-500/50 rounded-2xl p-6 flex flex-col justify-between backface-hidden shadow-2xl">
                        <div className="flex justify-between items-center text-xs text-indigo-400 font-bold uppercase tracking-wider">
                          <span>Question / Concept</span>
                          <span className="text-slate-500 font-normal">Tap to flip 🔄</span>
                        </div>
                        <p className="text-lg font-bold text-white text-center leading-snug">
                          {flashcards[currentCardIndex]?.front}
                        </p>
                        <div className="text-center text-xs text-slate-500">
                          Active Recall Phase
                        </div>
                      </div>

                      {/* BACK OF CARD */}
                      <div className="absolute inset-0 bg-slate-900 border-2 border-indigo-500/60 rounded-2xl p-6 flex flex-col justify-between rotate-y-180 backface-hidden shadow-2xl">
                        <div className="flex justify-between items-center text-xs text-emerald-400 font-bold uppercase tracking-wider">
                          <span>Simple Answer</span>
                          <span className="text-slate-500 font-normal">Rate Memory 🧠</span>
                        </div>
                        <p className="text-sm font-medium text-slate-200 leading-relaxed text-center">
                          {flashcards[currentCardIndex]?.back}
                        </p>
                        <div className="text-center text-xs text-slate-500">
                          SM-2 Interval Scheduling
                        </div>
                      </div>

                    </div>
                  </div>

                  {/* SRS RESPONSE BUTTONS */}
                  <div className="w-full max-w-md grid grid-cols-4 gap-2 pt-2">
                    <button
                      onClick={() => handleSM2Response(1)}
                      className="py-2.5 px-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold transition-all text-center"
                    >
                      <div>Again</div>
                      <div className="text-[10px] text-rose-500 font-normal">1 day</div>
                    </button>

                    <button
                      onClick={() => handleSM2Response(2)}
                      className="py-2.5 px-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-xl text-xs font-bold transition-all text-center"
                    >
                      <div>Hard</div>
                      <div className="text-[10px] text-amber-500 font-normal">3 days</div>
                    </button>

                    <button
                      onClick={() => handleSM2Response(3)}
                      className="py-2.5 px-2 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs font-bold transition-all text-center"
                    >
                      <div>Good</div>
                      <div className="text-[10px] text-indigo-500 font-normal">6 days</div>
                    </button>

                    <button
                      onClick={() => handleSM2Response(4)}
                      className="py-2.5 px-2 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-bold transition-all text-center"
                    >
                      <div>Easy</div>
                      <div className="text-[10px] text-emerald-500 font-normal">10 days</div>
                    </button>
                  </div>
                </>
              )}

            </div>
          )}

          {/* TAB 4: SAVED DECKS */}
          {activeTab === 'decks' && (
            <div className="flex-1 space-y-4 animate-fade-in">
              <h2 className="text-base font-bold text-slate-200">Your Saved Decks ({savedDecks.length})</h2>

              {savedDecks.length === 0 ? (
                <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-8 text-center space-y-3">
                  <i data-lucide="folder-open" className="w-10 h-10 text-slate-600 mx-auto"></i>
                  <p className="text-sm text-slate-400">No saved decks in your local browser storage yet.</p>
                  <button 
                    onClick={() => setActiveTab('dump')}
                    className="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded-xl transition-all"
                  >
                    Create Your First Deck
                  </button>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {savedDecks.map((deck) => (
                    <div key={deck.id} className="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4 hover:border-slate-700 transition-all">
                      <div>
                        <div className="flex justify-between items-start">
                          <h3 className="text-base font-bold text-white">{deck.title}</h3>
                          <span className="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full">
                            {deck.createdAt}
                          </span>
                        </div>
                        <p className="text-xs text-slate-400 mt-2">
                          {deck.modulesCount} Modules • {deck.cardsCount} Flashcards
                        </p>
                      </div>

                      <div className="flex items-center gap-2 pt-2 border-t border-slate-800/60">
                        <button
                          onClick={() => handleLoadDeck(deck)}
                          className="flex-1 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all"
                        >
                          <i data-lucide="play" className="w-3.5 h-3.5"></i>
                          <span>Study Deck</span>
                        </button>
                        <button
                          onClick={() => handleDeleteDeck(deck.id)}
                          className="p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs transition-all"
                        >
                          <i data-lucide="trash-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto pt-8 pb-4 text-center text-xs text-slate-500 border-t border-slate-900 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>Syllabi Open-Source Study Platform • Built for Students</div>
            <div className="flex items-center gap-4">
              <a href="https://github.com" target="_blank" className="hover:text-slate-300">GitHub Repo</a>
              <span>•</span>
              <span className="text-emerald-500 font-medium">Offline Local Storage Enabled</span>
            </div>
          </footer>

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
