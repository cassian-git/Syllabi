<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabi — Active Recall & Spaced Repetition</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- PDF.js for client-side PDF text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- Mammoth.js for client-side DOCX text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SuperMemo-2 (SM-2) Spaced Repetition Algorithm
    function calculateSM2(rating, repetitions, interval, easeFactor) {
      let newInterval;
      let newRepetitions;
      let newEaseFactor = easeFactor + (0.1 - (3 - rating) * (0.08 + (3 - rating) * 0.02));

      if (newEaseFactor < 1.3) newEaseFactor = 1.3;

      if (rating < 1) { 
        newRepetitions = 0;
        newInterval = 1;
      } else {
        if (repetitions === 0) {
          newInterval = 1;
        } else if (repetitions === 1) {
          newInterval = 6;
        } else {
          newInterval = Math.round(interval * newEaseFactor);
        }
        newRepetitions = repetitions + 1;
      }

      const nextReview = new Date();
      nextReview.setDate(nextReview.getDate() + newInterval);

      return {
        repetitions: newRepetitions,
        interval: newInterval,
        easeFactor: newEaseFactor,
        nextReview: nextReview.toISOString()
      };
    }

    function App() {
      const [inputText, setInputText] = useState('');
      const [isProcessingFile, setIsProcessingFile] = useState(false);
      const [dragActive, setDragActive] = useState(false);
      const [decks, setDecks] = useState(() => {
        const saved = localStorage.getItem('syllabi_decks');
        return saved ? JSON.parse(saved) : [];
      });
      const [activeDeck, setActiveDeck] = useState(null);
      const [currentCardIndex, setCurrentCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [deckTitle, setDeckTitle] = useState('');

      useEffect(() => {
        localStorage.setItem('syllabi_decks', JSON.stringify(decks));
      }, [decks]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeDeck, isFlipped, isProcessingFile]);

      // File Parsing (.pdf, .docx, .txt, .md)
      const processFile = async (file) => {
        if (!file) return;
        setIsProcessingFile(true);
        let extractedText = '';

        try {
          const fileType = file.name.split('.').pop().toLowerCase();

          if (fileType === 'txt' || fileType === 'md') {
            extractedText = await file.text();
          } else if (fileType === 'pdf') {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let pageTexts = [];
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              const pageStrings = content.items.map(item => item.str);
              pageTexts.push(pageStrings.join(' '));
            }
            extractedText = pageTexts.join('\n\n');
          } else if (fileType === 'docx') {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            extractedText = result.value;
          } else {
            alert('Unsupported file type. Please upload a .pdf, .docx, .txt, or .md file.');
            setIsProcessingFile(false);
            return;
          }

          if (!extractedText.trim()) {
            alert('Could not extract readable text from this file. If this is a scanned document, please paste text manually.');
          } else {
            setInputText(prev => prev ? prev + '\n\n' + extractedText : extractedText);
            if (!deckTitle) {
              setDeckTitle(file.name.replace(/\.[^/.]+$/, ""));
            }
          }
        } catch (error) {
          console.error("Error reading file:", error);
          alert('An error occurred while reading the file.');
        } finally {
          setIsProcessingFile(false);
        }
      };

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragActive(true);
        } else if (e.type === "dragleave") {
          setDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          processFile(e.dataTransfer.files[0]);
        }
      };

      const handleFileInput = (e) => {
        if (e.target.files && e.target.files[0]) {
          processFile(e.target.files[0]);
        }
      };

      // Improved Multi-Card Text Parser Logic
      const handleGenerateDeck = () => {
        if (!inputText.trim()) return;

        // Clean text and break into structured chunks
        let rawChunks = inputText
          .replace(/\r\n/g, '\n')
          .split(/\n+|\?|\b(?=\d+[\.\)]\s)/) 
          .map(chunk => chunk.trim())
          .filter(chunk => chunk.length > 10);

        const generatedCards = [];

        rawChunks.forEach((chunk, index) => {
          // Check for Key-Value pairs like "Concept: Explanation" or "Term - Definition"
          if (chunk.includes(':') || chunk.includes('–') || chunk.includes(' - ')) {
            const parts = chunk.split(/[:–]|\s-\s/);
            if (parts.length >= 2 && parts[0].trim().length < 80) {
              generatedCards.push({
                id: `card-${Date.now()}-${index}`,
                front: parts[0].replace(/^[\d\.\-\*•\s]+/, '').trim(),
                back: parts.slice(1).join(' ').trim(),
                repetitions: 0,
                interval: 1,
                easeFactor: 2.5,
                nextReview: new Date().toISOString()
              });
              return;
            }
          }

          // Fallback: Split long paragraphs by sentence structure into Q&A
          if (chunk.length > 20) {
            const cleanText = chunk.replace(/^[\d\.\-\*•\s]+/, '').trim();
            const words = cleanText.split(' ');
            if (words.length > 6) {
              const front = words.slice(0, 5).join(' ') + '...';
              const back = cleanText;
              generatedCards.push({
                id: `card-${Date.now()}-${index}`,
                front: front,
                back: back,
                repetitions: 0,
                interval: 1,
                easeFactor: 2.5,
                nextReview: new Date().toISOString()
              });
            }
          }
        });

        if (generatedCards.length === 0) {
          alert("Could not extract individual flashcards. Try organizing text with colons (Term: Definition) or bullet points.");
          return;
        }

        const newDeck = {
          id: `deck-${Date.now()}`,
          title: deckTitle.trim() || `Study Deck ${decks.length + 1}`,
          createdAt: new Date().toLocaleDateString(),
          cards: generatedCards
        };

        setDecks([newDeck, ...decks]);
        setActiveDeck(newDeck);
        setCurrentCardIndex(0);
        setIsFlipped(false);
        setInputText('');
        setDeckTitle('');
      };

      const handleAnswer = (rating) => {
        if (!activeDeck) return;

        const currentCard = activeDeck.cards[currentCardIndex];
        const updatedSM2 = calculateSM2(
          rating,
          currentCard.repetitions,
          currentCard.interval,
          currentCard.easeFactor
        );

        const updatedCards = [...activeDeck.cards];
        updatedCards[currentCardIndex] = { ...currentCard, ...updatedSM2 };

        const updatedDeck = { ...activeDeck, cards: updatedCards };
        setActiveDeck(updatedDeck);

        setDecks(decks.map(d => d.id === updatedDeck.id ? updatedDeck : d));

        setIsFlipped(false);
        if (currentCardIndex + 1 < activeDeck.cards.length) {
          setCurrentCardIndex(currentCardIndex + 1);
        } else {
          alert('Review session completed for this deck!');
          setActiveDeck(null);
        }
      };

      return (
        <div className="max-w-3xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="flex items-center justify-between border-b border-slate-800 pb-6 mb-8">
            <div className="flex items-center gap-3">
              <div className="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/20">
                <i data-lucide="book-open" className="w-6 h-6 text-white"></i>
              </div>
              <div>
                <h1 className="text-2xl font-bold text-white tracking-tight">Syllabi</h1>
                <p className="text-xs text-slate-400">Local-First Active Recall & Spaced Repetition</p>
              </div>
            </div>
            {activeDeck && (
              <button 
                onClick={() => setActiveDeck(null)}
                className="text-xs text-slate-400 hover:text-white border border-slate-700 rounded-lg px-3 py-1.5 transition"
              >
                ← Back to Dashboard
              </button>
            )}
          </header>

          {/* Active Review Mode */}
          {activeDeck ? (
            <div className="space-y-6">
              <div className="flex items-center justify-between text-sm text-slate-400">
                <span className="font-semibold text-slate-200">{activeDeck.title}</span>
                <span>Card {currentCardIndex + 1} of {activeDeck.cards.length}</span>
              </div>

              {/* Flashcard */}
              <div 
                onClick={() => setIsFlipped(!isFlipped)}
                className="w-full min-h-[260px] bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between cursor-pointer hover:border-slate-600 transition shadow-xl"
              >
                <div className="text-xs uppercase tracking-wider text-indigo-400 font-semibold">
                  {isFlipped ? 'Answer / Explanation' : 'Question / Concept'}
                </div>
                <div className="text-lg md:text-xl text-slate-100 font-medium my-auto text-center leading-relaxed">
                  {isFlipped 
                    ? activeDeck.cards[currentCardIndex].back 
                    : activeDeck.cards[currentCardIndex].front}
                </div>
                <div className="text-center text-xs text-slate-500">
                  Tap card to flip
                </div>
              </div>

              {/* SM-2 Rating Controls */}
              {isFlipped && (
                <div className="grid grid-cols-4 gap-2 pt-2">
                  <button 
                    onClick={() => handleAnswer(0)}
                    className="py-2.5 px-2 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 rounded-xl text-xs font-semibold transition"
                  >
                    Again <span className="block text-[10px] opacity-75 font-normal">1d</span>
                  </button>
                  <button 
                    onClick={() => handleAnswer(1)}
                    className="py-2.5 px-2 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 rounded-xl text-xs font-semibold transition"
                  >
                    Hard <span className="block text-[10px] opacity-75 font-normal">6d</span>
                  </button>
                  <button 
                    onClick={() => handleAnswer(2)}
                    className="py-2.5 px-2 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 rounded-xl text-xs font-semibold transition"
                  >
                    Good <span className="block text-[10px] opacity-75 font-normal">Auto</span>
                  </button>
                  <button 
                    onClick={() => handleAnswer(3)}
                    className="py-2.5 px-2 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 rounded-xl text-xs font-semibold transition"
                  >
                    Easy <span className="block text-[10px] opacity-75 font-normal">Boost</span>
                  </button>
                </div>
              )}
            </div>
          ) : (
            /* Creation & Dashboard Workspace */
            <div className="space-y-8">
              <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                  <i data-lucide="sparkles" className="w-5 h-5 text-indigo-400"></i>
                  Create Deck from Syllabus
                </h2>

                <input 
                  type="text"
                  placeholder="Deck Title (e.g., Operating Systems - Chapter 1)"
                  value={deckTitle}
                  onChange={(e) => setDeckTitle(e.target.value)}
                  className="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                />

                <div 
                  onDragEnter={handleDrag}
                  onDragLeave={handleDrag}
                  onDragOver={handleDrag}
                  onDrop={handleDrop}
                  className={`border-2 border-dashed rounded-xl p-4 text-center transition ${
                    dragActive ? 'border-indigo-500 bg-indigo-500/10' : 'border-slate-700 bg-slate-900/40'
                  }`}
                >
                  <i data-lucide="file-up" className="w-8 h-8 mx-auto text-slate-400 mb-2"></i>
                  <p className="text-xs text-slate-300 font-medium">
                    Drag and drop a <span className="text-indigo-400 font-semibold">PDF, DOCX, TXT</span>, or <span className="text-indigo-400 font-semibold">MD</span> file
                  </p>
                  <p className="text-[11px] text-slate-500 mt-1">or browse from your phone's storage</p>
                  <label className="inline-block mt-3 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg text-xs font-medium cursor-pointer transition">
                    Browse File
                    <input type="file" accept=".pdf,.docx,.txt,.md" onChange={handleFileInput} className="hidden" />
                  </label>
                </div>

                {isProcessingFile && (
                  <div className="text-center text-xs text-indigo-400 py-2 animate-pulse">
                    Parsing document into separate cards...
                  </div>
                )}

                <textarea
                  rows="5"
                  placeholder="Or paste text here... (Format: 'Term: Definition', '1. Concept - Details')"
                  value={inputText}
                  onChange={(e) => setInputText(e.target.value)}
                  className="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                ></textarea>

                <button 
                  onClick={handleGenerateDeck}
                  disabled={!inputText.trim() || isProcessingFile}
                  className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/20 transition flex items-center justify-center gap-2"
                >
                  <i data-lucide="layers" className="w-4 h-4"></i>
                  Generate Flashcard Deck
                </button>
              </div>

              {/* Saved Decks List */}
              <div className="space-y-4">
                <h3 className="text-md font-semibold text-slate-200 flex items-center justify-between">
                  <span>Your Study Decks</span>
                  <span className="text-xs text-slate-500 font-normal">{decks.length} Decks</span>
                </h3>

                {decks.length === 0 ? (
                  <div className="text-center py-12 border border-dashed border-slate-800 rounded-2xl text-slate-500 text-sm">
                    No study decks created yet. Upload a syllabus or paste text above to start.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {decks.map((deck) => (
                      <div 
                        key={deck.id}
                        className="bg-slate-800/40 border border-slate-700/50 rounded-xl p-5 hover:border-indigo-500/50 transition flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex items-center justify-between mb-2">
                            <h4 className="font-semibold text-slate-100 text-sm">{deck.title}</h4>
                            <button 
                              onClick={() => setDecks(decks.filter(d => d.id !== deck.id))}
                              className="text-slate-500 hover:text-red-400 text-xs transition"
                              title="Delete Deck"
                            >
                              <i data-lucide="trash-2" className="w-4 h-4"></i>
                            </button>
                          </div>
                          <p className="text-xs text-slate-400 mb-4">{deck.cards.length} Flashcards • Created {deck.createdAt}</p>
                        </div>
                        <button 
                          onClick={() => {
                            setActiveDeck(deck);
                            setCurrentCardIndex(0);
                            setIsFlipped(false);
                          }}
                          className="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-100 rounded-lg text-xs font-medium transition"
                        >
                          Start Review
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
