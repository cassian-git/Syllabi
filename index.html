<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllabi — Active Recall & Spaced Repetition</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">
  <div className="max-w-3xl mx-auto px-4 py-8" id="app">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-slate-800 pb-6 mb-8">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-600 rounded-xl shadow-lg shadow-indigo-500/20">
          <span class="text-xl">📚</span>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">Syllabi</h1>
          <p class="text-xs text-slate-400">Local-First Active Recall & Spaced Repetition</p>
        </div>
      </div>
    </header>

    <!-- App Container -->
    <div id="workspace" class="space-y-8">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
        <h2 class="text-lg font-semibold text-white flex items-center gap-2">
          <span>✨</span> Create Deck from Text / Syllabus
        </h2>

        <input 
          id="deckTitle" 
          type="text" 
          placeholder="Deck Title (e.g., Computer Security - Module 1)"
          class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        />

        <textarea
          id="inputText"
          rows="6"
          placeholder="Paste course notes, Q&A, or outline here...&#10;Format examples:&#10;• Term: Definition&#10;• What is X? Answer to X&#10;• 1. Concept - Description"
          class="w-full bg-slate-900/80 border border-slate-700 rounded-xl p-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        ></textarea>

        <button 
          onclick="generateDeck()"
          class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold shadow-lg shadow-indigo-600/20 transition"
        >
          Generate Flashcard Deck
        </button>
      </div>

      <!-- Decks Area -->
      <div class="space-y-4">
        <h3 class="text-md font-semibold text-slate-200">Your Study Decks</h3>
        <div id="decksList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </div>
  </div>

  <script>
    let decks = JSON.parse(localStorage.getItem('syllabi_decks') || '[]');
    let currentDeck = null;
    let currentCardIndex = 0;
    let isFlipped = false;

    function saveDecks() {
      localStorage.setItem('syllabi_decks', JSON.stringify(decks));
      renderDecks();
    }

    function parseTextToCards(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 5);
      const cards = [];

      lines.forEach((line) => {
        if (line.includes(':') || line.includes('-')) {
          const parts = line.split(/[:\-]/);
          if (parts.length >= 2) {
            cards.push({
              front: parts[0].replace(/^[\d\.\*\s]+/, '').trim(),
              back: parts.slice(1).join(' ').trim(),
              interval: 1, repetitions: 0, easeFactor: 2.5
            });
          }
        } else if (line.endsWith('?')) {
          cards.push({ front: line, back: "Review in notes.", interval: 1, repetitions: 0, easeFactor: 2.5 });
        } else if (line.length > 20) {
          cards.push({ front: "Concept", back: line, interval: 1, repetitions: 0, easeFactor: 2.5 });
        }
      });
      return cards;
    }

    function generateDeck() {
      const title = document.getElementById('deckTitle').value.trim() || 'Study Deck ' + (decks.length + 1);
      const text = document.getElementById('inputText').value.trim();

      if (!text) {
        alert('Please paste some study text first.');
        return;
      }

      const cards = parseTextToCards(text);
      if (cards.length === 0) {
        alert('Could not detect flashcard pairs. Try using "Term: Definition" format.');
        return;
      }

      const newDeck = { id: Date.now(), title, cards, createdAt: new Date().toLocaleDateString() };
      decks.unshift(newDeck);
      saveDecks();
      document.getElementById('inputText').value = '';
      document.getElementById('deckTitle').value = '';
    }

    function deleteDeck(id) {
      decks = decks.filter(d => d.id !== id);
      saveDecks();
    }

    function renderDecks() {
      const container = document.getElementById('decksList');
      if (decks.length === 0) {
        container.innerHTML = '<div class="col-span-2 text-center py-8 text-slate-500 border border-dashed border-slate-800 rounded-xl text-xs">No decks saved yet.</div>';
        return;
      }

      container.innerHTML = decks.map(d => `
        <div class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-5 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center mb-2">
              <h4 class="font-semibold text-white text-sm">${d.title}</h4>
              <button onclick="deleteDeck(${d.id})" class="text-xs text-slate-500 hover:text-red-400">🗑️</button>
            </div>
            <p class="text-xs text-slate-400 mb-4">${d.cards.length} Flashcards</p>
          </div>
          <button onclick="startReview(${d.id})" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs">Start Review</button>
        </div>
      `).join('');
    }

    function startReview(deckId) {
      currentDeck = decks.find(d => d.id === deckId);
      currentCardIndex = 0;
      isFlipped = false;
      renderCardView();
    }

    function renderCardView() {
      const workspace = document.getElementById('workspace');
      const card = currentDeck.cards[currentCardIndex];

      workspace.innerHTML = `
        <div class="space-y-6">
          <div class="flex items-center justify-between text-sm text-slate-400">
            <span class="font-semibold text-slate-200">${currentDeck.title}</span>
            <span>Card ${currentCardIndex + 1} of ${currentDeck.cards.length}</span>
          </div>

          <div onclick="toggleCard()" class="w-full min-h-[220px] bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col justify-between cursor-pointer text-center shadow-xl">
            <div class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">
              ${isFlipped ? 'Answer' : 'Question'}
            </div>
            <div class="text-lg text-slate-100 font-medium my-auto">
              ${isFlipped ? card.back : card.front}
            </div>
            <div class="text-xs text-slate-500">Tap card to flip</div>
          </div>

          ${isFlipped ? `
            <div class="grid grid-cols-2 gap-2">
              <button onclick="nextCard()" class="py-2.5 bg-red-500/20 text-red-400 rounded-xl text-xs font-semibold">Again</button>
              <button onclick="nextCard()" class="py-2.5 bg-emerald-500/20 text-emerald-400 rounded-xl text-xs font-semibold">Good</button>
            </div>
          ` : ''}

          <button onclick="location.reload()" class="w-full py-2 border border-slate-700 text-slate-400 rounded-xl text-xs">← Exit Review</button>
        </div>
      `;
    }

    function toggleCard() {
      isFlipped = !isFlipped;
      renderCardView();
    }

    function nextCard() {
      isFlipped = false;
      if (currentCardIndex + 1 < currentDeck.cards.length) {
        currentCardIndex++;
        renderCardView();
      } else {
        alert('Review Session Complete!');
        location.reload();
      }
    }

    renderDecks();
  </script>
</body>
</html>
